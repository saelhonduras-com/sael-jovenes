name: Keep-alive SAEL Hombres

# Mantiene despierto el backend en Render durante el horario de
# inscripciones (6am-10pm hora Honduras, UTC-6), para que nadie se
# encuentre con la pantalla de "despertando" al inscribirse.
#
# IMPORTANTE: este workflow tiene fecha de vencimiento (ver el paso
# "Verificar fecha" abajo). Después de esa fecha, hazte el hábito de
# BORRAR este archivo por completo (igual que se hizo con el de SFL) —
# si no se borra, el cron sigue programado para siempre y el próximo
# año se activaría solo, sin que nadie se acuerde de por qué.

on:
  schedule:
    # 6:00am a 11:59pm hora Honduras = 12:00 a 23:59 UTC
    - cron: '*/10 12-23 * * *'
    # 12:00am a 3:59am hora Honduras del día siguiente = 0:00 a 3:59 UTC
    - cron: '*/10 0-3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar fecha (activo solo hasta el 30 de agosto 2026)
        id: fecha
        run: |
          FECHA_LIMITE="2026-08-30"
          FECHA_HOY=$(date -u +%Y-%m-%d)
          if [[ "$FECHA_HOY" > "$FECHA_LIMITE" ]]; then
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "Fuera de la ventana de inscripciones — no se hace ping. Borra este workflow."
          else
            echo "activo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping al backend de SAEL Hombres
        if: steps.fecha.outputs.activo == 'true'
        run: |
          curl -sf https://saelhonduras-com-sael-hombres.onrender.com/api/salud-completa \
            || echo "El ping falló, pero no se detiene el workflow por esto."
